<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        .destaque {
            background-color: rgb(0, 225, 255);
        }

        .cnome {
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Tabela de Cadastro</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Professora</td>
        </tr>
        <tr class="destaque">
            <td>Franciane Nonata</td>
            <td>F</td>
            <td>19</td>
            <td>Psicóloga</td>
        </tr>
        <tr>
            <td>Arthur</td>
            <td>M</td>
            <td>25</td>
            <td>História</td>
        </tr>
        <tr class="destaque">
            <td>Rafael</td>
            <td>M</td>
            <td>30</td>
            <td>Motorista</td>
        </tr>
    </table>
</body>
</html>
