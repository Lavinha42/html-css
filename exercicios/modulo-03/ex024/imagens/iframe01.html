<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            width: 500px;
            height: 500px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
       <!--Tamanho padrão 300x150--> 
      <iframe src="https://www.cursoemvideo.com" frameborder="1" height="500" ><a href="https://www.cursoemvideo.com">Curso em Vídeo</a></iframe>

       para aprender a programar.</p>
    <p>O site do <iframe src="https//www.google.com.br" frameborder="0"></iframe> também é muito legal. Pena que não funciona dentro do iframe!</p>
</body>
</html>
